name: Trade Brain Windows

on:
  pull_request:
    paths:
      - "Start-TradeBrain.ps1"
      - "Start-TradeBrain.bat"
      - "scripts/Migrate-TradeBrainData.ps1"
      - "WINDOWS_SETUP.md"
      - ".github/workflows/tradebrain-windows.yml"
      - "pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/app.py"
      - "backend/tradebrain/**"
  push:
    branches:
      - "tradebrain/**"
    paths:
      - "Start-TradeBrain.ps1"
      - "Start-TradeBrain.bat"
      - "scripts/Migrate-TradeBrainData.ps1"
      - "WINDOWS_SETUP.md"
      - ".github/workflows/tradebrain-windows.yml"
      - "pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/app.py"
      - "backend/tradebrain/**"

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          foreach ($file in @('.\Start-TradeBrain.ps1', '.\scripts\Migrate-TradeBrainData.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Launcher prerequisite preflight
        shell: powershell
        run: .\Start-TradeBrain.ps1 -CheckOnly

      - name: Validate double-click BAT wrapper
        shell: cmd
        run: call Start-TradeBrain.bat -CheckOnly

      - name: Windows first-run setup and end-to-end health smoke
        shell: powershell
        run: .\Start-TradeBrain.ps1 -SmokeTest -NoBrowser
