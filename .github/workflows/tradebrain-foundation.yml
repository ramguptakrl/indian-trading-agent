name: Trade Brain Foundation

on:
  pull_request:
    paths:
      - "backend/tradebrain/**"
      - "backend/routers/tradebrain.py"
      - "backend/routers/tradebrain_phase3.py"
      - "backend/routers/tradebrain_phase4.py"
      - "backend/routers/tradebrain_phase5.py"
      - "backend/routers/tradebrain_phase6.py"
      - "backend/routers/recommender.py"
      - "backend/routers/daily_verdict.py"
      - "backend/app.py"
      - "tradingagents/default_config.py"
      - "tradingagents/agents/trader/trader.py"
      - "tradingagents/agents/managers/portfolio_manager.py"
      - "tests/test_tradebrain_*.py"
      - "scripts/tradebrain_phase2_smoke.py"
      - "scripts/tradebrain_phase3_smoke.py"
      - "scripts/tradebrain_phase4_smoke.py"
      - "scripts/tradebrain_phase5_smoke.py"
      - "scripts/tradebrain_phase6_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/tradebrain-foundation.yml"
  push:
    branches:
      - "tradebrain/**"
    paths:
      - "backend/tradebrain/**"
      - "backend/routers/tradebrain.py"
      - "backend/routers/tradebrain_phase3.py"
      - "backend/routers/tradebrain_phase4.py"
      - "backend/routers/tradebrain_phase5.py"
      - "backend/routers/tradebrain_phase6.py"
      - "backend/routers/recommender.py"
      - "backend/routers/daily_verdict.py"
      - "backend/app.py"
      - "tradingagents/default_config.py"
      - "tradingagents/agents/trader/trader.py"
      - "tradingagents/agents/managers/portfolio_manager.py"
      - "tests/test_tradebrain_*.py"
      - "scripts/tradebrain_phase2_smoke.py"
      - "scripts/tradebrain_phase3_smoke.py"
      - "scripts/tradebrain_phase4_smoke.py"
      - "scripts/tradebrain_phase5_smoke.py"
      - "scripts/tradebrain_phase6_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/tradebrain-foundation.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Trade Brain test dependencies
        run: >-
          python -m pip install
          "pydantic>=2,<3"
          "requests>=2.32"
          "pypdf>=5,<7"
          "tzdata>=2025.2"
          "yfinance>=0.2.63"
      - name: Compile Trade Brain integration files
        run: >-
          python -m compileall -q
          backend/tradebrain
          backend/routers/tradebrain.py
          backend/routers/tradebrain_phase3.py
          backend/routers/tradebrain_phase4.py
          backend/routers/tradebrain_phase5.py
          backend/routers/tradebrain_phase6.py
          backend/app.py
          scripts/tradebrain_phase2_smoke.py
          scripts/tradebrain_phase3_smoke.py
          scripts/tradebrain_phase4_smoke.py
          scripts/tradebrain_phase5_smoke.py
          scripts/tradebrain_phase6_smoke.py
          tradingagents/agents/trader/trader.py
          tradingagents/agents/managers/portfolio_manager.py
      - name: Run Trade Brain tests
        run: python -m unittest discover -s tests -p "test_tradebrain_*.py" -v
      - name: Live Phase 2 exchange + attachment smoke (observational)
        continue-on-error: true
        run: python scripts/tradebrain_phase2_smoke.py
      - name: Live Phase 3 market-data + replay smoke (observational)
        continue-on-error: true
        run: python scripts/tradebrain_phase3_smoke.py
      - name: Live Phase 4 strict outcome + focus lab smoke (observational)
        continue-on-error: true
        run: python scripts/tradebrain_phase4_smoke.py
      - name: Live Phase 5 frozen challenger smoke (observational)
        continue-on-error: true
        run: python scripts/tradebrain_phase5_smoke.py
      - name: Live Phase 6 resident net-cost paper smoke (observational)
        continue-on-error: true
        run: python scripts/tradebrain_phase6_smoke.py
